# Publishes the Groups app (the web/ folder) to GitHub Pages.
#
# Pages is a static host, so this puts the front end online — installable to an
# iPhone Home Screen — while your group's data stays on whatever server you run.
# Set a GROUPS_API_BASE repository variable to point every install at it by
# default; otherwise the app asks on first launch.
name: Publish app to Pages

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "web/**"
      - "scripts/make-icons.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Draw the icons and iOS splash screens
        run: node scripts/make-icons.mjs --force

      - name: Point the app at the group's server
        if: vars.GROUPS_API_BASE != ''
        run: |
          printf '{ "apiBase": "%s" }\n' "${{ vars.GROUPS_API_BASE }}" > web/server.json
          echo "Default server: ${{ vars.GROUPS_API_BASE }}"

      - name: Stop Pages from running the app through Jekyll
        run: touch web/.nojekyll

      # Tries to switch Pages on, but the Actions token is usually not allowed
      # to create a Pages site — so this is best-effort and we explain the fix.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Explain the one click we cannot do for you
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "## Turn Pages on once"
            echo ""
            echo "GitHub Actions is not allowed to enable Pages for a repository by itself."
            echo "It is a single setting, and you only ever do it once:"
            echo ""
            echo "1. Open [Settings -> Pages](https://github.com/${{ github.repository }}/settings/pages)"
            echo "2. Under **Source**, choose **GitHub Actions**"
            echo "3. Re-run this workflow"
            echo ""
            echo "Then the app is live at \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Enable Pages first::Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Where it went
        run: |
          echo "### Groups is live" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**${{ steps.deploy.outputs.page_url }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Open that on your iPhone in Safari, then Share -> Add to Home Screen." >> $GITHUB_STEP_SUMMARY
